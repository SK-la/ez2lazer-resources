name: Build

on:
  # PR 只跑 pull_request；master 直推仍跑。忽略一切 tag，避免上游/误推 tag 触发 CI。
  pull_request:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build -c Release osu.Game.Resources
